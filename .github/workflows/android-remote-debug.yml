name: Android Remote Branch - Debug Build
on:
  push:
    branches:
      - feature/remote-control-cloudflare-v1
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-remote-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Check required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK (not production-ready)
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload debug APK only if build succeeded
        uses: actions/upload-artifact@v4
        with:
          name: mikroteck-remote-debug-unverified
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
